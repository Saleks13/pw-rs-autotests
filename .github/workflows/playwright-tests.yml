name: Daily Playwright Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  test:
    runs-on: ubuntu-latest
    environment: .env.${{ inputs.environment || 'test' }}

    env:
      TARGET_ENV: ${{ inputs.environment || 'test' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERS_USERSINGLEORG_EMAIL: ${{ secrets.USERS_USERSINGLEORG_EMAIL }}
          USERS_USERSINGLEORG_PASSWORD: ${{ secrets.USERS_USERSINGLEORG_PASSWORD }}
          USERS_USERMULTIORG_EMAIL: ${{ secrets.USERS_USERMULTIORG_EMAIL }}
          USERS_USERMULTIORG_PASSWORD: ${{ secrets.USERS_USERMULTIORG_PASSWORD }}
          LOCALE: ${{ secrets.LOCALE }}
        run: ENV=${{ env.TARGET_ENV }} npx playwright test

      - name: Parse test results
        if: always()
        id: results
        run: |
          ENV_LABEL=$(echo "$TARGET_ENV" | sed 's/^./\U&/')
          if [ -f test-results.json ]; then
            PASSED=$(jq '.stats.expected' test-results.json)
            FAILED=$(jq '.stats.unexpected' test-results.json)
            SKIPPED=$(jq '.stats.skipped' test-results.json)
            TOTAL=$((PASSED + FAILED + SKIPPED))

            if [ "$FAILED" -eq 0 ]; then
              echo "subject=✅ All $TOTAL tests passed on $ENV_LABEL server" >> $GITHUB_OUTPUT
            else
              echo "subject=❌ $PASSED out of $TOTAL tests passed on $ENV_LABEL server" >> $GITHUB_OUTPUT
            fi
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
          else
            echo "subject=⚠️ Test results unavailable on $ENV_LABEL server" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./playwright-report

      - name: Send Email with Report Link
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USER }}
          subject: ${{ steps.results.outputs.subject }}
          body: |
            ${{ steps.results.outputs.subject }}

            Passed: ${{ steps.results.outputs.passed }}
            Failed: ${{ steps.results.outputs.failed }}
            Skipped: ${{ steps.results.outputs.skipped }}
            Total:  ${{ steps.results.outputs.total }}

            Full report: https://saleks13.github.io/pw-rs-autotests/index.html
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          to: ${{ secrets.REPORT_EMAIL }}
name: Daily Playwright Tests

on:
  push:
    branches:
      -main
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: .env.test 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright dependencies
        run: npx playwright install

      # Set environment variables from secrets
      - name: Set environment variables
        env:
          USERS_USERSINGLEORG_EMAIL: ${{ secrets.USERS_USERSINGLEORG_EMAIL }}
          USERS_USERSINGLEORG_PASSWORD: ${{ secrets.USERS_USERSINGLEORG_PASSWORD }}
          USERS_USERMULTIORG_EMAIL: ${{ secrets.USERS_USERMULTIORG_EMAIL }}
          USERS_USERMULTIORG_PASSWORD: ${{ secrets.USERS_USERMULTIORG_PASSWORD }}
          LOCALE: ${{ secrets.LOCALE }}
        run: echo "Environment variables set."

      # Run Playwright tests
      - name: Run Playwright tests
        env:
          USERS_USERSINGLEORG_EMAIL: ${{ secrets.USERS_USERSINGLEORG_EMAIL }}
          USERS_USERSINGLEORG_PASSWORD: ${{ secrets.USERS_USERSINGLEORG_PASSWORD }}
          USERS_USERMULTIORG_EMAIL: ${{ secrets.USERS_USERMULTIORG_EMAIL }}
          USERS_USERMULTIORG_PASSWORD: ${{ secrets.USERS_USERMULTIORG_PASSWORD }}
          LOCALE: ${{ secrets.LOCALE }}
        run: ENV=test npx playwright test

      - name: Upload Playwright report
        if: always() # Ensures the step runs even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./playwright-report
      - name: Send Email with Report Link
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: ${{ secrets.EMAIL_USER }}
          subject: "Playwright Test Report"
          body: |
            The Playwright test report is available at:
            https://saleks13.github.io/pw-rs-autotests/index.html
          to: saleks.v@gmail.com